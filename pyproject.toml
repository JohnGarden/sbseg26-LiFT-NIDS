[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lift_nids"
version = "1.0.0"
description = "LiFT-NIDS: Lightweight Flow Transformers for Network Intrusion Detection Systems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "LiFT-NIDS Contributors" }]
dependencies = [
    "torch>=2.1",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/JohnGarden/sbseg26-LiFT-NIDS"

[dependency-groups]
dev = ["ipykernel>=6.29", "notebook>=7.2"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
lint = ["ruff>=0.4", "mypy>=1.10"]
docs = []
data = ["duckdb>=1.0", "lxml>=5.0", "requests>=2.31", "tqdm>=4.66", "polars>=1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lift_nids*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["lift_nids"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true
mypy_path = ["src"]

[tool.uv]
default-groups = ["dev", "test", "lint", "data"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
