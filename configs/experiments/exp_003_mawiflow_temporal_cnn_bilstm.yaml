project:
  name: LiFT-NIDS

seed: 42

experiment:
  name: exp_003_mawiflow_temporal_cnn_bilstm
  dataset_config: configs/datasets/mawiflow.yaml
  model_config: configs/models/cnn_bilstm.yaml
  base_configs:
    - configs/base/data.yaml
    - configs/base/training.yaml
    - configs/base/evaluation.yaml
    - configs/base/paths.yaml
  protocol:
    split: temporal
    crossdataset:
      enabled: false
  temporal_sequence:
    enabled: true
    window_size: 16
    stride: 8
  outputs:
    save_predictions: true
    save_checkpoints: true
    save_metrics_json: true
    registry_tag: mawiflow_temporal_cnn_bilstm
