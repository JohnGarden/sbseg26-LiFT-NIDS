project:
  name: LiFT-NIDS

seed: 42

model:
  family: xgboost
  name: xgb_baseline
  input_representation: tabular
  layer: tabular_baseline  # camada 1: baselines tabulares
  params:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: logloss
